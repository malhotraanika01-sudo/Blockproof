# BlockProof — local stack.
#   docker compose up -d postgres        # just the database (fastest path)
#   docker compose up -d                  # database + adminer
#   docker compose --profile app up -d    # + dockerized API and web
# Hyperledger Fabric runs from its own compose in fabric/ (see fabric/network.sh).

services:
  postgres:
    image: postgres:16-alpine
    container_name: blockproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blockproof
      POSTGRES_PASSWORD: blockproof
      POSTGRES_DB: blockproof
    # Host port 5433 to avoid clashing with a locally-installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockproof -d blockproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: blockproof-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  server:
    profiles: ["app"]
    build: ./server
    container_name: blockproof-server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://blockproof:blockproof@postgres:5432/blockproof?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: ./web
    container_name: blockproof-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
